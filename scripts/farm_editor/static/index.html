<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6f4e'/%3E%3Cpath d='M3 12h10M3 8h10M3 4h10' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/vendor/geoman/leaflet-geoman.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <strong>Farm editor</strong>
    <span id="filepath" class="muted"></span>
    <span id="dirty"></span>
    <span class="spacer"></span>
    <input id="goto" type="text" placeholder="Go to lat, lon" size="18">
    <button id="btn-open" type="button" title="Replace the editor content with a local file">Open…</button>
    <button id="btn-import" type="button" title="Add the features of a GeoJSON file">Import…</button>
    <button id="btn-export" type="button" title="Download the current farm">Export</button>
    <button id="btn-validate" type="button">Validate</button>
    <button id="btn-save" type="button" class="primary" title="Ctrl+S">Save</button>
    <input id="file-input" type="file" accept=".geojson,.json,application/geo+json,application/json" hidden>
  </header>
  <main>
    <aside id="workflow"></aside>
    <div id="map"></div>
    <aside id="side">
      <section id="props"></section>
      <section id="issues"></section>
    </aside>
  </main>
  <footer id="statusbar">
    <span id="status"></span>
    <span id="mode"></span>
    <span class="spacer"></span>
    <span id="counts"></span>
    <span id="cursor"></span>
  </footer>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/vendor/geoman/leaflet-geoman.js"></script>
  <script src="/static/vendor/Leaflet.ImageOverlay.Rotated.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
