# Voxeland on the Isaac Sim tour bag, without voxeland_robot_perception:
# rgb + depth -> depth_image_proc (organized cloud) -> semantic_cloud_adapter (labels, frame,
# SemanticPointCloud) -> voxeland_server. The cloud_in contract is in docs/specs/CLOUD_IN_SPEC.md.
# Works from any directory; save_map writes the PLY into the cwd.
launch:
  - arg:
      name: camera
      default: /sensor_rig/front_camera
  # frame the points are sent in (pose = this frame in world); "" keeps the optical frame
  - arg:
      name: output_frame
      default: zed_x_front
  - arg:
      name: drop_far_points
      default: "false"
  - arg:
      name: rviz
      default: "true"
  - arg:
      name: show_scene_graph
      default: "true"
  # the repo's data/ folder: five levels above this package's share dir (ros/install/ninsar_bringup/share/ninsar_bringup)
  - arg:
      name: data_dir
      default: "$(find-pkg-share ninsar_bringup)/../../../../../data"
  # ros2 run ninsar_farm make_isaac_farm_dsg output, in the bag's "world" frame
  - arg:
      name: scene_graph
      default: "$(var data_dir)/dsg/isaac_farm_dsg.json"
  - arg:
      name: scene_graph_viz_config
      default: "$(find-pkg-share ninsar_bringup)/config/isaac_farm_viz.yaml"
  # box/class queries on the map: /voxel_query/query (docs/guides/VOXELAND_GUIDE.md, "Querying the map")
  - arg:
      name: voxel_query
      default: "true"
  # per-frame objects from cloud_in: /object_detector/{detections,markers,clusters} (docs/specs/OBJECT_DETECTOR.md)
  - arg:
      name: detector
      default: "true"

  # rgb + depth -> organized XYZRGB cloud in the optical frame (the Isaac images are rectified)
  - node:
      pkg: depth_image_proc
      exec: point_cloud_xyzrgb_node
      name: point_cloud_xyzrgb
      output: screen
      remap:
        - {from: rgb/camera_info, to: "$(var camera)/camera_info"}
        - {from: rgb/image_rect_color, to: "$(var camera)/rgb"}
        - {from: depth_registered/image_rect, to: "$(var camera)/depth"}
        - {from: points, to: "$(var camera)/points"}

  # organized cloud + label image + labels JSON + TF -> SemanticPointCloud on cloud_in
  - node:
      pkg: ninsar_perception
      exec: semantic_cloud_adapter
      name: semantic_cloud_adapter
      output: screen
      param:
        - from: "$(find-pkg-share ninsar_bringup)/config/isaac/semantic_cloud_adapter.yaml"
        - {name: points_topic, value: "$(var camera)/points"}
        - {name: labels_image_topic, value: "$(var camera)/semantic_segmentation"}
        - {name: labels_json_topic, value: "$(var camera)/semantic_labels"}
        - {name: output_frame, value: "$(var output_frame)"}
        - {name: drop_far_points, value: "$(var drop_far_points)"}

  # Voxeland mapping server, integrating cloud_in into the fixed frame of the bag
  - node:
      pkg: voxeland
      exec: voxeland_server_node
      name: voxeland_server
      output: screen
      param:
        - from: "$(find-pkg-share ninsar_mapping)/config/voxeland_server.yaml"

  # Queries the server's map on demand; idle (no subscriptions) between queries
  - node:
      if: "$(var voxel_query)"
      pkg: ninsar_mapping
      exec: voxel_query
      name: voxel_query
      output: screen
      param:
        - from: "$(find-pkg-share ninsar_mapping)/config/voxel_query.yaml"

  # cloud_in -> per-class clusters and yaw boxes, in the cloud's frame (ninsar_perception, C++/PCL)
  - node:
      if: "$(var detector)"
      pkg: ninsar_perception
      exec: object_detector
      name: object_detector
      output: screen
      param:
        - from: "$(find-pkg-share ninsar_bringup)/config/isaac/object_detector.yaml"

  # Scene graph markers on /hydra_dsg_visualizer/graph (transient local). Same node as hydra_visualizer's
  # static_visualizer.launch.yaml, but without its on_exit shutdown: a missing graph file stops only this node.
  - node:
      if: "$(var show_scene_graph)"
      pkg: hydra_visualizer
      exec: hydra_visualizer_node
      name: hydra_dsg_visualizer
      output: screen
      args: >-
        --config-utilities-file $(var scene_graph_viz_config)
        --config-utilities-file $(find-pkg-share hydra_visualizer)/config/visualizer_plugins.yaml
        --config-utilities-file $(find-pkg-share hydra_visualizer)/config/external_plugins.yaml
        --config-utilities-yaml {glog_level: 0, glog_verbosity: 0}
        --config-utilities-yaml {graph: {type: GraphFromFile, frame_id: world, filepath: $(var scene_graph)}}
        --config-utilities-yaml {plugins: {mesh: {use_color_adapter: false}}}

  - node:
      if: "$(var rviz)"
      pkg: rviz2
      exec: rviz2
      name: rviz2
      output: screen
      args: "-d $(find-pkg-share ninsar_bringup)/rviz/isaac_voxeland.rviz"
